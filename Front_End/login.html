<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Virtual Physics Laboratory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/neumorphism.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-flask"></i>
                <h1>Virtual Physics Laboratory</h1>
            </div>

            <div id="login-form" class="auth-form">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-username">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" id="login-username" name="username" required autocomplete="username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter password">
                    </div>
                    <div id="login-error" class="error-message"></div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                
                <div class="auth-divider">
                    <span>or</span>
                </div>
                
                <button type="button" class="btn-google" onclick="handleGoogleLogin()">
                    <i class="fab fa-google"></i> Sign in with Google
                </button>
                
                <p class="switch-form">
                    Don't have an account? <a href="" id="show-register">Register here</a>
                </p>
            </div>

            <div id="register-form" class="auth-form" style="display: none;">
                <h2>Register</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="register-username">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" id="register-username" name="username" required autocomplete="username" placeholder="Create username">
                    </div>
                    <div class="form-group">
                        <label for="register-password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" id="register-password" name="password" required autocomplete="new-password" placeholder="Create password">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">
                            <i class="fas fa-lock"></i> Confirm Password
                        </label>
                        <input type="password" id="register-confirm-password" name="confirmPassword" required autocomplete="new-password" placeholder="Repeat password">
                    </div>
                    <div id="register-error" class="error-message"></div>
                    <div id="register-success" class="success-message"></div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-user-plus"></i> Register
                    </button>
                </form>
                
                <div class="auth-divider">
                    <span>or</span>
                </div>
                
                <button type="button" class="btn-google" onclick="handleGoogleLogin()">
                    <i class="fab fa-google"></i> Sign up with Google
                </button>
                
                <p class="switch-form">
                    Already have an account? <a href="#" id="show-login">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyBD_jKUZtkf8w5Kq5W_bxH7RzI87uv06LA",
            authDomain: "virtual-lab-fisika.firebaseapp.com",
            projectId: "virtual-lab-fisika",
            storageBucket: "virtual-lab-fisika.firebasestorage.app",
            messagingSenderId: "446903949556",
            appId: "1:446903949556:web:3c820e835b6eada8c0a1f0"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        window.handleGoogleLogin = async function() {
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const idToken = await result.user.getIdToken();
                
                const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                    ? 'http://localhost:3001'
                    : 'https://project-uts-pawm-production.up.railway.app';
                    
                const response = await fetch(`${API_URL}/auth/google`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ idToken })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    window.location.href = 'index.html';
                } else {
                    const errorElement = document.getElementById('login-error') || document.getElementById('register-error');
                    if (errorElement) {
                        errorElement.textContent = data.error || 'Google authentication failed';
                        errorElement.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Google authentication error:', error);
                const errorElement = document.getElementById('login-error') || document.getElementById('register-error');
                if (errorElement) {
                    errorElement.textContent = 'An error occurred during Google authentication: ' + (error.message || error);
                    errorElement.style.display = 'block';
                }
            }
        };
    </script>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
